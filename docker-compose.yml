services:
  postgres:
    image: postgres:17
    container_name: plugzing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: plugzing
    ports:
      - "5432:5432"
    volumes:
      - plugzing_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: plugzing_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - plugzing_redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plugzing_app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

volumes:
  plugzing_postgres_data:
  plugzing_redis_data: